<svg xmlns="http://www.w3.org/2000/svg" width="1000" viewBox="0 0 1300 1060" role="img" aria-labelledby="title desc">
<title id="title">Full proposed S4 heat-pump system with internal heat exchanger</title>
<desc id="desc">A closed R1233zd(E) refrigerant loop flows from compressor state 1 to condenser state 2, internal heat exchanger hot inlet state 3, valve inlet state 4, evaporator inlet state 5, internal heat exchanger cold inlet state 6, and back to state 1. Source water cools from 35 to 30 Celsius. Separate sink water heats from 120 to 130 Celsius with a 100 kilowatt duty. The IHX has two isolated counter-flow channels.</desc>
<defs>
 <marker id="hot" markerWidth="16" markerHeight="16" refX="4" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 L4 8 Z" fill="#d85a33"/></marker>
 <marker id="cold" markerWidth="16" markerHeight="16" refX="4" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 L4 8 Z" fill="#6b5bb8"/></marker>
 <marker id="water" markerWidth="16" markerHeight="16" refX="4" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 L4 8 Z" fill="#16869b"/></marker>
 <marker id="energy" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 L3 6 Z" fill="#c38a14"/></marker>
 <style>
 text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;fill:#1e293b;font-size:18px}
 .title{font-size:31px;font-weight:700}.sub{font-size:18px;fill:#64748b}.label{font-size:21px;font-weight:650}.small{font-size:16px;fill:#64748b}.hotlabel{fill:#b64d2a}.coldlabel{fill:#6554aa}.waterlabel{fill:#11778b}
 .pipe{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.hp{stroke:#d85a33}.lp{stroke:#6b5bb8}.water{stroke:#16869b}.heat{stroke:#c38a14;stroke-width:2.4;stroke-dasharray:7 5;fill:none}.state{fill:#fff;stroke:#475569;stroke-width:1.5}.num{font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
 </style>
</defs>
<rect width="1300" height="1060" fill="#fff"/>
<text x="650" y="48" text-anchor="middle" class="title">S4 · Complete proposed heat-pump system</text>
<text x="650" y="81" text-anchor="middle" class="sub">Three separate fluid circuits · nominal design conditions · state numbers match the report</text>

<!-- Exchanger boundaries: condenser 420,165 to880,325; IHX475,365 to825,635; evaporator420,745 to880,905 -->
<rect x="420" y="165" width="460" height="160" rx="20" fill="#fff8f3" stroke="#dfb8a6" stroke-width="1.6"/>
<rect x="475" y="365" width="350" height="270" rx="20" fill="#f8f7fd" stroke="#b9afd9" stroke-width="1.6"/>
<rect x="420" y="745" width="460" height="160" rx="20" fill="#f0fafb" stroke="#a7cdd2" stroke-width="1.6"/>

<!-- External pipework: no stream crossings -->
<path class="pipe hp" d="M280 385 L280 245 Q280 220 305 220 L403 220" marker-end="url(#hot)"/>
<path class="pipe hp" d="M885 220 L925 220 Q950 220 950 245 L950 335 Q950 360 925 360 L760 360 L760 378" marker-end="url(#hot)"/>
<path class="pipe hp" d="M760 627 L760 650 Q760 675 785 675 L875 675 Q900 675 900 650 L900 530 Q900 505 925 505 L975 505 Q1000 505 1000 530 L1000 538" marker-end="url(#hot)"/>
<path class="pipe lp" d="M1000 640 L1000 775 Q1000 800 975 800 L897 800" marker-end="url(#cold)"/>
<path class="pipe lp" d="M415 800 L390 800 Q365 800 365 775 L365 690 Q365 665 390 665 L515 665 Q540 665 540 640 L540 627" marker-end="url(#cold)"/>
<path class="pipe lp" d="M540 393 L540 355 Q540 340 520 340 L405 340 Q380 340 380 365 L380 425 Q380 450 355 450 L347 450" marker-end="url(#cold)"/>

<!-- Condenser: refrigerant right, water left -->
<path class="pipe hp" d="M425 220 L863 220" marker-end="url(#hot)"/>
<path d="M1195 285 L970 285 C970 265 930 265 930 285 L437 285" fill="none" stroke="#fff" stroke-width="12"/>
<path class="pipe water" d="M1195 285 L970 285 C970 265 930 265 930 285 L437 285" marker-end="url(#water)"/>
<path d="M415 285 L300 285 C300 265 260 265 260 285 L107 285" fill="none" stroke="#fff" stroke-width="12"/>
<path class="pipe water" d="M415 285 L300 285 C300 265 260 265 260 285 L107 285" marker-end="url(#water)"/>
<path class="heat" d="M650 234 L650 264" marker-end="url(#energy)"/>
<text x="650" y="145" text-anchor="middle" class="label">CONDENSER · useful heat = 100 kW</text>
<text x="650" y="199" text-anchor="middle" class="small">Condensing level: 135°C</text>
<text x="745" y="257" text-anchor="middle" class="small">Heat to water</text>
<text x="1080" y="252" text-anchor="middle" class="waterlabel">Sink inlet · 120°C</text>
<text x="235" y="252" text-anchor="middle" class="waterlabel">Sink outlet · 130°C</text>
<text x="650" y="310" text-anchor="middle" class="small">Pressurized water · 10 bar · no mixing with refrigerant</text>

<!-- Compressor -->
<circle cx="280" cy="450" r="65" fill="#fff8e8" stroke="#c99e43" stroke-width="2"/>
<path d="M258 485 L258 415 L313 450 Z" fill="#f1d79c" stroke="#a97b23" stroke-width="1.5"/>
<text x="244" y="550" text-anchor="middle" class="label">COMPRESSOR</text>
<text x="244" y="577" text-anchor="middle" class="small">Isentropic efficiency = 0.70</text>
<path class="heat" d="M90 450 L200 450" marker-end="url(#energy)"/>
<text x="145" y="414" text-anchor="middle">Shaft work in</text>
<text x="140" y="517" text-anchor="middle" class="small">Calculated by model</text>

<!-- IHX: ONE physical unit; two isolated channels -->
<text x="650" y="399" text-anchor="middle" class="label">IHX</text>
<text x="650" y="429" text-anchor="middle" class="small">Internal exchanger</text>
<rect x="514" y="420" width="52" height="180" rx="12" fill="#eeebfa"/>
<rect x="734" y="420" width="52" height="180" rx="12" fill="#fce9df"/>
<path class="pipe lp" d="M540 620 L540 410" marker-end="url(#cold)"/>
<path class="pipe hp" d="M760 383 L760 610" marker-end="url(#hot)"/>
<path class="heat" d="M722 510 L584 510" marker-end="url(#energy)"/>
<text x="650" y="486" text-anchor="middle" class="small">Internal heat</text>
<text x="650" y="546" text-anchor="middle" class="small">Liquid → suction</text>


<text x="650" y="708" text-anchor="middle" class="small">One exchanger · two separated channels · counter-flow</text>

<!-- Valve -->
<path d="M970 555 L1030 595 L970 635 Z" fill="#fff" stroke="#64748b" stroke-width="2"/>
<path d="M1030 555 L970 595 L1030 635 Z" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="1117" y="552" text-anchor="middle" class="label">EXPANSION</text>
<text x="1117" y="579" text-anchor="middle" class="label">VALVE</text>
<text x="1117" y="611" text-anchor="middle" class="small">Pressure falls</text>
<text x="1117" y="636" text-anchor="middle" class="small">Enthalpy unchanged</text>

<!-- Evaporator: refrigerant left, source water right -->
<path class="pipe lp" d="M875 800 L437 800" marker-end="url(#cold)"/>
<path class="pipe water" d="M90 865 L863 865" marker-end="url(#water)"/>
<path class="pipe water" d="M885 865 L1178 865" marker-end="url(#water)"/>
<path class="heat" d="M650 850 L650 822" marker-end="url(#energy)"/>
<text x="650" y="735" text-anchor="middle" class="label">EVAPORATOR · heat recovered from waste water</text>
<text x="650" y="779" text-anchor="middle" class="small">Evaporating level: 25°C</text>
<text x="765" y="840" text-anchor="middle" class="small">Heat to refrigerant</text>
<text x="230" y="832" text-anchor="middle" class="waterlabel">Source inlet · 35°C</text>
<text x="1075" y="832" text-anchor="middle" class="waterlabel">Source outlet · 30°C</text>
<text x="650" y="890" text-anchor="middle" class="small">Waste-heat water · 3 bar · no mixing with refrigerant</text>

<!-- State badges and labels; positioned beside pipes -->
<circle cx="410" cy="340" r="15" class="state"/><text x="410" y="341" class="num">1</text>
<text x="360" y="118" text-anchor="middle" class="small">High-pressure refrigerant ≈ 20.99 bar</text>
<circle cx="345" cy="220" r="15" class="state"/><text x="345" y="221" class="num">2</text>
<text x="280" y="190" text-anchor="middle" class="small">Discharge T: calculated</text>
<circle cx="950" cy="335" r="15" class="state"/><text x="950" y="336" class="num">3</text>
<text x="1075" y="368" text-anchor="middle" class="hotlabel">Liquid at 130°C</text>
<text x="1075" y="394" text-anchor="middle" class="small">5 K condenser subcooling</text>
<circle cx="850" cy="675" r="15" class="state"/><text x="850" y="676" class="num">4</text>

<circle cx="950" cy="800" r="15" class="state"/><text x="950" y="801" class="num">5</text>
<text x="1092" y="768" text-anchor="middle" class="small">Liquid + vapour</text>
<circle cx="365" cy="720" r="15" class="state"/><text x="365" y="721" class="num">6</text>
<text x="205" y="686" text-anchor="middle" class="coldlabel">Evaporator exit: 25°C</text>
<text x="205" y="713" text-anchor="middle" class="small">Quality x = 0.90</text>
<text x="205" y="740" text-anchor="middle" class="small">90% vapour by mass</text>
<text x="436" y="437" text-anchor="middle" class="coldlabel">30°C</text>
<text x="430" y="464" text-anchor="middle" class="small">5 K superheat</text>

<!-- Legend and first law: outside diagram body -->
<rect x="45" y="936" width="1210" height="98" rx="16" fill="#f8fafc"/>
<path class="pipe hp" d="M75 962 L115 962"/><text x="130" y="968" class="small">High-pressure refrigerant</text>
<path class="pipe lp" d="M405 962 L445 962"/><text x="460" y="968" class="small">Low-pressure refrigerant ≈ 1.30 bar</text>
<path class="pipe water" d="M815 962 L855 962"/><text x="870" y="968" class="small">Water flow</text>
<path class="heat" d="M1050 962 L1090 962"/><text x="1105" y="968" class="small">Heat / work</text>
<text x="650" y="1009" text-anchor="middle">Heat delivered = heat recovered + compressor work · IHX heat stays inside the cycle</text>
</svg>
